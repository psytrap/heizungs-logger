[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heizungslogger"
version = "0.1.0"
description = "Multi-channel temperature logger for a heat pump, reading an Arduino over serial"
requires-python = ">=3.10"
dependencies = ["python-dateutil>=2.8"]

[project.optional-dependencies]
hardware = [
    "pyserial>=3.5",
    "Adafruit-Blinka>=8",
    "adafruit-circuitpython-charlcd>=3.4",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
heizungslogger = "heizungslogger.cli:main"
heizungslogger-web = "heizungslogger.web_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
